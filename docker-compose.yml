services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    env_file: ./backend/.env
    volumes: ["./backend:/app"]
  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      - VITE_API_TARGET=http://backend:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports: ["5173:5173"]
    volumes: ["./frontend:/app"]
    depends_on: [backend]
